<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F4F6FB;--surface:#FFF;--surface2:#F0F2F8;
  --border:#E2E6F0;--border2:#D0D6E8;
  --text:#1A1F36;--text2:#6B7599;--text3:#A0AABF;
  --accent:#4F6EF7;
  --known:#10B981;--almost:#F59E0B;--relearn:#EF4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
h1,h2,h3{font-family:'Syne',sans-serif;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px;box-shadow:0 2px 12px rgba(0,0,0,.05);}
.header-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;height:64px;}
.logo{font-family:'Syne';font-size:22px;font-weight:800;letter-spacing:-.5px;}
.logo span{color:var(--accent);}
.user-info{margin-left:auto;display:flex;align-items:center;gap:12px;}
.user-email{font-size:12px;color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.btn-logout{padding:7px 16px;border-radius:8px;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans';transition:all .2s;}
.btn-logout:hover{border-color:#EF4444;color:#EF4444;}
.prog-wrap{display:flex;align-items:center;gap:8px;}
.prog-bar-bg{width:110px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#4F6EF7,#10B981);transition:width .5s;}
.prog-label{font-size:12px;color:var(--text2);font-weight:700;min-width:32px;}

/* AUTH */
#authScreen{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#EEF2FF,#F4F6FB);}
.auth-box{background:#fff;border:1px solid var(--border);border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(79,110,247,.1);}
.auth-logo{font-family:'Syne';font-size:28px;font-weight:800;text-align:center;margin-bottom:6px;}
.auth-logo span{color:var(--accent);}
.auth-sub{text-align:center;font-size:13px;color:var(--text2);margin-bottom:28px;}
.auth-tabs{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:24px;}
.auth-tab{flex:1;padding:10px;border-radius:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text2);}
.auth-tab.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.inp{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:14px;margin-bottom:12px;font-family:'DM Sans';transition:border-color .2s;}
.inp:focus{border-color:var(--accent);outline:none;background:#fff;}
.inp::placeholder{color:var(--text3);}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5;}
.btn-primary{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:'Syne';border:none;transition:all .2s;box-shadow:0 4px 16px rgba(79,110,247,.3);}
.btn-primary:hover{background:#3B5CE6;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.auth-msg{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:none;}
.auth-err{background:#FFF5F5;border:1px solid #FCA5A5;color:#DC2626;}
.auth-ok{background:#F0FDF4;border:1px solid #86EFAC;color:#16A34A;}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;}
.divider hr{flex:1;border:none;border-top:1px solid var(--border);}
.divider span{font-size:12px;color:var(--text3);}
.btn-google{width:100%;padding:12px;border-radius:12px;background:#fff;border:1.5px solid var(--border2);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans';display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;}
.btn-google:hover{border-color:var(--accent);}

/* MAIN */
.main{max-width:860px;margin:0 auto;padding:28px 20px 80px;display:none;}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:center;}
.stat-num{font-family:'Syne';font-size:24px;font-weight:800;}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px;}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.tab{padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .2s;font-family:'DM Sans';}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,110,247,.25);}
.tab.inactive{background:#fff;color:var(--text2);border-color:var(--border);}
.tab.inactive:hover{border-color:var(--accent);color:var(--accent);}

/* TOPIC CARD */
.topic-card{background:#fff;border:1.5px solid var(--border);border-radius:18px;padding:20px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;margin-bottom:14px;display:flex;align-items:center;gap:16px;animation:fadeUp .2s ease;}
.topic-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.1);}
.topic-icon{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.topic-info{flex:1;min-width:0;}
.topic-name{font-family:'Syne';font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-family:'DM Sans';font-weight:700;}
.topic-desc{font-size:12px;color:var(--text2);margin-bottom:10px;}
.prog-bar-sm{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.prog-fill-sm{height:100%;border-radius:3px;transition:width .4s;}
.topic-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.topic-pct{font-family:'Syne';font-size:20px;font-weight:800;}
.topic-count{font-size:11px;color:var(--text3);}
.btn-del{background:none;cursor:pointer;font-size:15px;color:var(--text3);padding:4px;transition:color .2s;border:none;}
.btn-del:hover{color:#EF4444;}

/* FORM */
.add-btn-dashed{width:100%;padding:16px;border-radius:14px;background:transparent;border:2px dashed var(--border2);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans';transition:all .2s;}
.add-btn-dashed:hover{border-color:var(--accent);color:var(--accent);background:#F0F4FF;}
.form-box{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:22px;margin-top:12px;animation:fadeUp .2s ease;box-shadow:0 4px 16px rgba(0,0,0,.06);}
.form-title{font-family:'Syne';font-size:12px;font-weight:800;color:var(--text2);margin-bottom:14px;text-transform:uppercase;letter-spacing:1.5px;}
.form-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.emoji-chip{padding:7px 11px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);font-size:18px;cursor:pointer;transition:all .2s;}
.emoji-chip.sel{border-color:var(--accent);background:#EEF2FF;}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.color-dot{width:28px;height:28px;border-radius:8px;cursor:pointer;border:3px solid transparent;transition:all .2s;}
.color-dot.sel{border-color:var(--text);transform:scale(1.15);}
.btn-row{display:flex;gap:10px;}
.btn-act{flex:1;padding:12px;border-radius:10px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:'Syne';border:none;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.btn-act:hover{opacity:.88;}
.btn-act:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.btn-sec{padding:12px 18px;border-radius:10px;background:var(--surface2);color:var(--text2);font-weight:600;font-size:14px;cursor:pointer;font-family:'DM Sans';border:1px solid var(--border);}
.btn-sec:hover{background:var(--border);}

/* TOPIC HEADER */
.topic-hdr{background:#fff;border-radius:18px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;gap:16px;border:1.5px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.05);}
.hdr-icon{font-size:38px;}
.hdr-info h2{font-family:'Syne';font-size:22px;font-weight:800;}
.hdr-info p{font-size:13px;color:var(--text2);margin-top:4px;}
.hdr-stat{margin-left:auto;text-align:right;flex-shrink:0;}
.hdr-pct{font-family:'Syne';font-size:28px;font-weight:800;}
.hdr-sub{font-size:11px;color:var(--text2);}

/* STATUS FILTER */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid transparent;font-family:'DM Sans';transition:all .2s;display:flex;align-items:center;gap:6px;}
.filter-btn.all{background:#EEF2FF;color:var(--accent);border-color:#C7D2FE;}
.filter-btn.all.active,.filter-btn.all:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.filter-btn.known{background:#ECFDF5;color:var(--known);border-color:#A7F3D0;}
.filter-btn.known.active,.filter-btn.known:hover{background:var(--known);color:#fff;border-color:var(--known);}
.filter-btn.almost{background:#FFFBEB;color:var(--almost);border-color:#FDE68A;}
.filter-btn.almost.active,.filter-btn.almost:hover{background:var(--almost);color:#fff;border-color:var(--almost);}
.filter-btn.relearn{background:#FFF5F5;color:var(--relearn);border-color:#FECACA;}
.filter-btn.relearn.active,.filter-btn.relearn:hover{background:var(--relearn);color:#fff;border-color:var(--relearn);}
.filter-btn.new-card{background:#F5F3FF;color:#7C3AED;border-color:#DDD6FE;}
.filter-btn.new-card.active,.filter-btn.new-card:hover{background:#7C3AED;color:#fff;border-color:#7C3AED;}

/* ══ FLASHCARD GRID ══ */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px;}

/* FLASHCARD */
.flashcard-wrap{perspective:1000px;height:200px;cursor:pointer;}
.flashcard-wrap.tall{height:240px;}
.flashcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);border-radius:18px;}
.flashcard.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:20px;display:flex;flex-direction:column;border:1.5px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.06);}
.card-front{background:#fff;}
.card-back{background:#fff;transform:rotateY(180deg);}
.card-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:12px;align-self:flex-start;letter-spacing:.5px;text-transform:uppercase;}
.card-text{flex:1;font-size:14px;font-weight:500;line-height:1.6;color:var(--text);overflow-y:auto;max-height:100px;}
.card-text strong{font-weight:700;color:var(--text);}
.card-text br{display:block;margin:2px 0;content:'';}
.card-hint{font-size:11px;color:var(--text3);margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:4px;}
.card-status-bar{display:flex;gap:6px;margin-top:auto;padding-top:12px;}
.status-btn{flex:1;padding:7px 4px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:'DM Sans';transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.status-btn span{font-size:16px;}
.sb-known{background:#ECFDF5;color:var(--known);}
.sb-known:hover,.sb-known.active{background:var(--known);color:#fff;}
.sb-almost{background:#FFFBEB;color:var(--almost);}
.sb-almost:hover,.sb-almost.active{background:var(--almost);color:#fff;}
.sb-relearn{background:#FFF5F5;color:var(--relearn);}
.sb-relearn:hover,.sb-relearn.active{background:var(--relearn);color:#fff;}
.card-actions{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:10;}
.card-act-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s;opacity:0;}
.flashcard-wrap:hover .card-act-btn{opacity:1;}
.card-act-btn:hover{background:var(--surface2);}

/* STATUS INDICATOR on front */
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* STUDY MODE */
#studyMode{display:none;position:fixed;inset:0;background:rgba(26,31,54,.6);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:20px;}
.study-box{background:#fff;border-radius:24px;width:100%;max-width:560px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.study-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.study-title{font-family:'Syne';font-size:16px;font-weight:800;}
.study-progress{font-size:13px;color:var(--text2);}
.study-card-wrap{padding:32px 32px 24px;perspective:1000px;}
.study-card{height:260px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer;}
.study-card.flipped{transform:rotateY(180deg);}
.study-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1.5px solid var(--border);}
.study-front{background:linear-gradient(135deg,#EEF2FF,#F5F3FF);}
.study-back{background:linear-gradient(135deg,#F0FDF4,#ECFDF5);transform:rotateY(180deg);}
.study-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:16px;}
.study-text{font-size:18px;font-weight:600;line-height:1.6;color:var(--text);}
.study-hint{font-size:12px;color:var(--text3);margin-top:16px;}
.study-assess{padding:0 32px 28px;display:none;}
.study-assess-title{font-size:13px;font-weight:600;color:var(--text2);text-align:center;margin-bottom:14px;}
.study-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.study-btn{padding:14px 8px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'DM Sans';transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.study-btn span{font-size:24px;}
.study-btn-known{background:#ECFDF5;color:var(--known);}
.study-btn-known:hover{background:var(--known);color:#fff;transform:translateY(-2px);box-shadow:0 4px 16px rgba(16,185,129,.3);}
.study-btn-almost{background:#FFFBEB;color:var(--almost);}
.study-btn-almost:hover{background:var(--almost);color:#fff;transform:translateY(-2px);box-shadow:0 4px 16px rgba(245,158,11,.3);}
.study-btn-relearn{background:#FFF5F5;color:var(--relearn);}
.study-btn-relearn:hover{background:var(--relearn);color:#fff;transform:translateY(-2px);box-shadow:0 4px 16px rgba(239,68,68,.3);}
.study-footer{padding:0 32px 28px;display:flex;gap:10px;}
.btn-study-nav{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Syne';border:none;transition:all .2s;}
.btn-skip{background:var(--surface2);color:var(--text2);}
.btn-skip:hover{background:var(--border);}
.btn-end{background:#1A1F36;color:#fff;}
.btn-end:hover{background:#2D3561;}

/* MISC */
.loading{text-align:center;padding:60px 0;color:var(--text2);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
.empty{text-align:center;padding:50px 0;}
.empty-icon{font-size:52px;margin-bottom:16px;}
.empty p{color:var(--text2);font-size:14px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 22px;font-size:13px;font-weight:600;color:var(--text);z-index:999;animation:fadeUp .2s ease;display:none;box-shadow:0 8px 32px rgba(0,0,0,.12);white-space:nowrap;}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px) translateX(-50%);}to{opacity:1;transform:translateY(0) translateX(-50%);}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="logo">Learning<span>Hub</span></div>
    <div class="user-info" id="userInfo" style="display:none">
      <div class="prog-wrap">
        <div class="prog-bar-bg"><div class="prog-bar-fill" id="gProgBar" style="width:0%"></div></div>
        <div class="prog-label" id="gProgLabel">0%</div>
      </div>
      <div class="avatar" id="userAvatar">?</div>
      <div class="user-email" id="userEmail"></div>
      <button class="btn-logout" onclick="logout()">Đăng xuất</button>
    </div>
  </div>
</div>

<!-- AUTH -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">Learning<span>Hub</span></div>
    <div class="auth-sub">Học bằng Flashcard — ghi nhớ hiệu quả hơn</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="setAuthMode('login')">Đăng nhập</div>
      <div class="auth-tab" id="tabReg" onclick="setAuthMode('register')">Đăng ký</div>
    </div>
    <div class="auth-msg auth-err" id="authErr"></div>
    <div class="auth-msg auth-ok"  id="authOk"></div>
    <input class="inp" id="aEmail" type="email"    placeholder="Email của bạn..."/>
    <input class="inp" id="aPass"  type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)..."/>
    <input class="inp" id="aPass2" type="password" placeholder="Nhập lại mật khẩu..." style="display:none"/>
    <button class="btn-primary" id="authBtn" onclick="handleAuth()">Đăng nhập</button>
    <div class="divider"><hr><span>hoặc</span><hr></div>
    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.6 26.8 36 24 36c-5.3 0-9.6-2.9-11.3-7.1l-6.6 5.1C9.7 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.4 4.2-4.4 5.5l6.2 5.2C41 35.3 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      Tiếp tục với Google
    </button>
  </div>
</div>

<!-- MAIN APP -->
<div class="main" id="appMain">
  <div class="stats-bar" id="statsBar"></div>
  <div class="tabs">
    <div class="tab active" id="tabTopics" onclick="switchView('topics')">📚 Chủ Đề</div>
    <div class="tab inactive" id="tabCards" style="display:none" onclick="switchView('cards')"></div>
  </div>

  <!-- TOPICS VIEW -->
  <div id="viewTopics">
    <div id="topicList"></div>
    <button class="add-btn-dashed" id="btnShowTopic" onclick="toggleForm('topic',true)">＋ Thêm Chủ Đề Mới</button>
    <div class="form-box" id="formTopic" style="display:none">
      <div class="form-title">✨ Chủ Đề Mới</div>
      <input class="inp" id="ntTitle" placeholder="Tên chủ đề (VD: Bán Hàng, Marketing...)"/>
      <input class="inp" id="ntDesc"  placeholder="Mô tả ngắn..."/>

// ── DB ────────────────────────────────────────
async function loadTopics(){
  document.getElementById('topicList').innerHTML='<div class="loading"><div class="spinner"></div><p>Đang tải...</p></div>';
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout')),10000));
  let data,error;
  try{const r=await Promise.race([sb.from('topics').select('*,tasks(*)').eq('user_id',user.id).order('created_at'),timeout]);data=r.data;error=r.error;}
  catch(e){error={message:e.message};}
  if(error){document.getElementById('topicList').innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><p style="color:#EF4444">${error.message}</p></div>`;return;}
  topics=(data||[]).map(t=>({...t,tasks:(t.tasks||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}));
  activeId=activeId||topics[0]?.id||null;
}

async function dbInsertTopic(o){const{data,error}=await sb.from('topics').insert({user_id:user.id,...o}).select().single();if(error){toast('Lỗi: '+error.message,false);return null;}return data;}
async function dbDeleteTopic(id){await sb.from('topics').delete().eq('id',id).eq('user_id',user.id);}
async function dbInsertCard(o,topicId){
  const{data,error}=await sb.from('tasks').insert({user_id:user.id,topic_id:topicId,title:o.question,note:o.answer,question:o.question,answer:o.answer,duration:30,done:false,status:'new'}).select().single();
  if(error){toast('Lỗi: '+error.message,false);return null;}return data;
}
async function dbUpdateCard(id,fields){await sb.from('tasks').update(fields).eq('id',id).eq('user_id',user.id);}
async function dbDeleteCard(id){await sb.from('tasks').delete().eq('id',id).eq('user_id',user.id);}

// ── HELPERS ───────────────────────────────────
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function md(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')  // **bold**
    .replace(/\*(.+?)\*/g,'<em>$1</em>')               // *italic*
    .replace(/\n/g,'<br>');                             // newlines
}
const h2r=(h,a)=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;};
const activeTopic=()=>topics.find(t=>t.id===activeId);
const taskStatus=tk=>tk.status||'new';
const knownCount=t=>(t.tasks||[]).filter(k=>taskStatus(k)==='known').length;
const totalKnown=()=>topics.reduce((s,t)=>s+knownCount(t),0);
const totalCards=()=>topics.reduce((s,t)=>s+(t.tasks?.length||0),0);
const gPct=()=>{const tot=totalCards(),k=totalKnown();return tot?Math.round(k/tot*100):0;};

function updProg(){
  const p=gPct(),tot=totalCards(),k=totalKnown();
  document.getElementById('gProgBar').style.width=p+'%';
  document.getElementById('gProgLabel').textContent=p+'%';
  document.getElementById('statsBar').innerHTML=`
    <div class="stat-card"><div class="stat-num" style="color:var(--accent)">${topics.length}</div><div class="stat-lbl">Chủ đề</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#7C3AED">${tot}</div><div class="stat-lbl">Flashcards</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--known)">${k}</div><div class="stat-lbl">Đã thuộc</div></div>
    <div class="stat-card"><div class="stat-num" style="color:${p===100?'var(--known)':'var(--accent)'}">${p}%</div><div class="stat-lbl">Tiến độ</div></div>`;
}

function openTopic(id){

// ── RENDER TOPICS ─────────────────────────────
function renderTopics(){
  updProg();
  const list=document.getElementById('topicList');list.innerHTML='';
  if(!topics.length){list.innerHTML='<div class="empty"><div class="empty-icon">🎯</div><p>Tạo chủ đề đầu tiên để bắt đầu!</p></div>';return;}
  topics.forEach(t=>{
    const tot=t.tasks?.length||0,k=knownCount(t),pct=tot?Math.round(k/tot*100):0;
    const div=document.createElement('div');div.className='topic-card';
    div.style.borderColor=activeId===t.id?t.color:'';
    div.innerHTML=`
      <div class="topic-icon" style="background:${h2r(t.color,.12)}">${t.emoji}</div>
      <div class="topic-info">
        <div class="topic-name">${esc(t.title)}<span class="badge" style="color:${t.color};background:${h2r(t.color,.12)}">${k}/${tot} thuộc</span></div>
        <div class="topic-desc">${esc(t.description||'Chưa có mô tả')}</div>
        <div class="prog-bar-sm"><div class="prog-fill-sm" style="width:${pct}%;background:${t.color}"></div></div>
      </div>
      <div class="topic-meta">
        <div class="topic-pct" style="color:${pct===100?'var(--known)':t.color}">${pct}%</div>
        <div class="topic-count">${tot} cards</div>
        <button class="btn-del" onclick="event.stopPropagation();deleteTopic('${t.id}')">🗑</button>
      </div>`;
    div.addEventListener('click',()=>openTopic(t.id));
    list.appendChild(div);
  });
}

// ── RENDER CARDS (FLASHCARDS) ─────────────────
function setFilter(f){
  currentFilter=f;
  ['all','new','known','almost','relearn'].forEach(x=>{
    const btn=document.getElementById('fb_'+x);
    if(btn) btn.classList.toggle('active',x===f);
  });
  renderCards();
}

function renderCards(){
  const t=activeTopic();if(!t)return;
  const tot=t.tasks?.length||0,k=knownCount(t),pct=tot?Math.round(k/tot*100):0;

  // Header
  document.getElementById('topicHeader').innerHTML=`
    <div class="hdr-icon">${t.emoji}</div>
    <div class="hdr-info"><h2>${esc(t.title)}</h2><p>${esc(t.description||'')}</p></div>
    <div class="hdr-stat"><div class="hdr-pct" style="color:${pct===100?'var(--known)':t.color}">${pct}%</div><div class="hdr-sub">${k}/${tot} đã thuộc</div></div>`;
  document.getElementById('topicHeader').style.borderColor=t.color+'55';
  document.getElementById('btnAddCard').style.background=t.color;
  document.getElementById('btnStudy').style.background=t.color;

  // Count per status
  const counts={all:tot,new:0,known:0,almost:0,relearn:0};
  (t.tasks||[]).forEach(tk=>counts[taskStatus(tk)]++);
  Object.keys(counts).forEach(k=>{const el=document.getElementById('fc_'+k);if(el)el.textContent='('+counts[k]+')';});

  // Filter
  const cards=(t.tasks||[]).filter(tk=>currentFilter==='all'||taskStatus(tk)===currentFilter);

  const grid=document.getElementById('cardGrid');grid.innerHTML='';
  if(!cards.length){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📭</div><p>Chưa có flashcard nào!'+(currentFilter!=='all'?' Thử chọn "Tất cả"':'')+'</p></div>';
    updProg();return;
  }

  cards.forEach(tk=>{
    const st=taskStatus(tk),sm=STATUS_META[st]||STATUS_META.new;
    const q=tk.question||tk.title||'';
    const a=tk.answer||tk.note||'';
    const wrap=document.createElement('div');
    wrap.className='flashcard-wrap'+(a.length>100?' tall':'');

    wrap.innerHTML=`
      <div class="flashcard" id="fc_${tk.id}">
        <div class="card-face card-front" style="border-color:${sm.color}33">
          <div class="card-badge" style="background:${sm.bg};color:${sm.color}">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${sm.color};margin-right:5px;vertical-align:middle"></span>${sm.label}
          </div>
          <div class="card-text">${md(q)}</div>
          <div class="card-hint">👆 Nhấn để xem đáp án</div>
        </div>
        <div class="card-face card-back" style="border-color:${sm.color}33;background:linear-gradient(135deg,${sm.bg},#fff)">
          <div class="card-badge" style="background:${sm.bg};color:${sm.color}">ĐÁP ÁN</div>
          <div class="card-text" style="font-size:13px">${md(a)}</div>
          <div class="card-status-bar">
            <button class="status-btn sb-known  ${st==='known'  ?'active':''}" onclick="event.stopPropagation();setStatus('${t.id}','${tk.id}','known')">  <span>✅</span>Đã thuộc</button>
            <button class="status-btn sb-almost ${st==='almost' ?'active':''}" onclick="event.stopPropagation();setStatus('${t.id}','${tk.id}','almost')"> <span>🔆</span>Gần thuộc</button>
            <button class="status-btn sb-relearn ${st==='relearn'?'active':''}" onclick="event.stopPropagation();setStatus('${t.id}','${tk.id}','relearn')"><span>🔁</span>Học lại</button>
          </div>
        </div>
        <div class="card-actions">
          <button class="card-act-btn" title="Sửa" onclick="event.stopPropagation();editCard('${t.id}','${tk.id}')">✏️</button>
          <button class="card-act-btn" title="Xoá" onclick="event.stopPropagation();deleteCard('${t.id}','${tk.id}')">🗑</button>
        </div>
      </div>`;

    // Flip on click
    wrap.addEventListener('click',()=>{
      const fc=document.getElementById('fc_'+tk.id);
      fc.classList.toggle('flipped');
    });
    grid.appendChild(wrap);
  });
  updProg();
}

// ── TOPIC CRUD ────────────────────────────────
function toggleForm(type,show){
  const isT=type==='topic';
  document.getElementById(isT?'formTopic':'formCard').style.display=show?'':'none';
  document.getElementById(isT?'btnShowTopic':'btnShowCard').style.display=show?'none':'';
}
async function addTopic(){
  const title=document.getElementById('ntTitle').value.trim();if(!title){document.getElementById('ntTitle').focus();return;}
  const desc=document.getElementById('ntDesc').value.trim();
  const btn=document.getElementById('btnAddTopic');btn.disabled=true;btn.textContent='...';
  const saved=await dbInsertTopic({title,description:desc,emoji:selEmoji,color:selColor});
  btn.disabled=false;btn.textContent='Tạo Chủ Đề';if(!saved)return;
  saved.tasks=[];topics.push(saved);
  document.getElementById('ntTitle').value='';document.getElementById('ntDesc').value='';
  toggleForm('topic',false);activeId=saved.id;renderTopics();openTopic(saved.id);toast('✅ Đã tạo chủ đề!');
}
async function deleteTopic(id){
  if(!confirm('Xoá chủ đề và tất cả flashcard?'))return;
  topics=topics.filter(t=>t.id!==id);if(activeId===id)activeId=topics[0]?.id||null;
  document.getElementById('tabCards').style.display='none';switchView('topics');
  await dbDeleteTopic(id);toast('🗑 Đã xoá chủ đề');
}

// ── CARD CRUD ─────────────────────────────────
async function addCard(){
  const q=document.getElementById('nkQ').value.trim();
  const a=document.getElementById('nkA').value.trim();
  if(!q){document.getElementById('nkQ').focus();return;}
  const btn=document.getElementById('btnAddCard');btn.disabled=true;btn.textContent='...';
  const saved=await dbInsertCard({question:q,answer:a},activeId);
  btn.disabled=false;btn.textContent='Thêm Flashcard';if(!saved)return;
  topics=topics.map(t=>t.id===activeId?{...t,tasks:[...t.tasks,saved]}:t);
  document.getElementById('nkQ').value='';document.getElementById('nkA').value='';
  toggleForm('card',false);renderCards();toast('✅ Đã thêm flashcard!');
}

async function setStatus(topicId,cardId,status){
  topics=topics.map(t=>t.id===topicId?{...t,tasks:t.tasks.map(k=>k.id===cardId?{...k,status,done:status==='known'}:k)}:t);
  renderCards();await dbUpdateCard(cardId,{status,done:status==='known'});
  const msgs={known:'✅ Đã thuộc!',almost:'🔆 Gần thuộc!',relearn:'🔁 Sẽ ôn lại!'};
  toast(msgs[status]||'Đã lưu!');
}

function editCard(topicId,cardId){
  const t=topics.find(x=>x.id===topicId);
  const tk=t?.tasks.find(x=>x.id===cardId);if(!tk)return;
  const q=prompt('Câu hỏi:',tk.question||tk.title||'');if(q===null)return;
  const a=prompt('Đáp án:',tk.answer||tk.note||'');if(a===null)return;
  if(!q.trim())return;
  topics=topics.map(t=>t.id===topicId?{...t,tasks:t.tasks.map(k=>k.id===cardId?{...k,question:q,answer:a,title:q,note:a}:k)}:t);
  renderCards();dbUpdateCard(cardId,{question:q,answer:a,title:q,note:a});toast('✅ Đã cập nhật!');
}

async function deleteCard(topicId,cardId){
  if(!confirm('Xoá flashcard này?'))return;
  topics=topics.map(t=>t.id===topicId?{...t,tasks:t.tasks.filter(k=>k.id!==cardId)}:t);
  renderCards();await dbDeleteCard(cardId);toast('🗑 Đã xoá');
}

// ── STUDY MODE ────────────────────────────────
function startStudy(){
  const t=activeTopic();if(!t)return;
  studyQueue=(t.tasks||[]).filter(tk=>currentFilter==='all'||taskStatus(tk)===currentFilter);
  if(!studyQueue.length){toast('Không có card nào để ôn!',false);return;}
  // Shuffle
  studyQueue=studyQueue.sort(()=>Math.random()-.5);
  studyIdx=0;studyFlipped=false;
  document.getElementById('studyMode').style.display='flex';
  showStudyCard();
}

function showStudyCard(){
  if(studyIdx>=studyQueue.length){endStudy();return;}
  const tk=studyQueue[studyIdx];
  document.getElementById('studyQ').innerHTML=md(tk.question||tk.title||'');
  document.getElementById('studyA').innerHTML=md(tk.answer||tk.note||'');
  document.getElementById('studyProg').textContent=`${studyIdx+1} / ${studyQueue.length}`;
  document.getElementById('studyCard').classList.remove('flipped');
  document.getElementById('studyAssess').style.display='none';
  studyFlipped=false;
}

function flipStudyCard(){
  if(studyFlipped)return;
  studyFlipped=true;
  document.getElementById('studyCard').classList.add('flipped');
  setTimeout(()=>document.getElementById('studyAssess').style.display='',300);
}

function rateCard(status){
  const tk=studyQueue[studyIdx];
  const t=activeTopic();
  if(t&&tk){
    topics=topics.map(tp=>tp.id===t.id?{...tp,tasks:tp.tasks.map(k=>k.id===tk.id?{...k,status,done:status==='known'}:k)}:tp);
    dbUpdateCard(tk.id,{status,done:status==='known'});
  }
  studyIdx++;showStudyCard();
}

function skipCard(){studyIdx++;showStudyCard();}

function endStudy(){
  document.getElementById('studyMode').style.display='none';
  renderCards();toast('🎉 Hoàn thành ôn tập!');
}

// ── PICKERS ───────────────────────────────────
function buildPickers(){buildEmojiPicker();buildColorPicker();}
function buildEmojiPicker(){
  const w=document.getElementById('emojiRow');w.innerHTML='';
  EMOJIS.forEach(e=>{const b=document.createElement('button');b.className='emoji-chip'+(e===selEmoji?' sel':'');b.textContent=e;b.onclick=()=>{selEmoji=e;w.querySelectorAll('.emoji-chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};w.appendChild(b);});
}
function buildColorPicker(){
  const w=document.getElementById('colorRow');w.innerHTML='';
  COLORS.forEach(c=>{const b=document.createElement('button');b.className='color-dot'+(c===selColor?' sel':'');b.style.background=c;b.onclick=()=>{selColor=c;w.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};w.appendChild(b);});
}

['aPass','aPass2'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')handleAuth();}));
// Close study mode on backdrop click
document.getElementById('studyMode').addEventListener('click',e=>{if(e.target===e.currentTarget)endStudy();});
</script>
</body>
